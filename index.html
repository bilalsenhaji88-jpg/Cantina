
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouCode Cantine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-5 py-5 flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-green-700">YouCode Cantine</h1>
        <p class="text-sm text-gray-500 mt-1">Gestion du menu hebdomadaire</p>
      </div>

      <button id="add-button" class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg">
        + Ajouter une recette
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8">

    <section class="grid sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-white border rounded-xl p-5">
        <p class="text-sm text-gray-500">Budget journalier</p>
        <p class="text-2xl font-bold mt-2">50 DH</p>
      </div>

      <div class="bg-white border rounded-xl p-5">
        <p class="text-sm text-gray-500">Recettes disponibles</p>
        <p id="recipe-count" class="text-2xl font-bold mt-2">0</p>
      </div>

      <div class="bg-white border rounded-xl p-5">
        <p class="text-sm text-gray-500">Jours planifiés</p>
        <p id="planned-count" class="text-2xl font-bold mt-2">0 / 5</p>
      </div>
    </section>

    <section class="mb-10">
      <div class="mb-5">
        <h2 class="text-xl font-bold">Planning de la semaine</h2>
        <p class="text-sm text-gray-500 mt-1">Choisissez les repas de chaque jour.</p>
      </div>

      <div id="planning" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </section>

    <section>
      <div class="flex flex-wrap justify-between items-center gap-4 mb-5">
        <div>
          <h2 class="text-xl font-bold">Réserve de recettes</h2>
          <p class="text-sm text-gray-500 mt-1">Recherchez et gérez vos recettes.</p>
        </div>

        <input
          id="search"
          type="search"
          placeholder="Rechercher une recette..."
          class="border border-gray-300 bg-white rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-green-600">
      </div>

      <div class="flex flex-wrap gap-2 mb-5">
        <button data-filter="Tous" class="filter-btn bg-green-700 text-white px-4 py-2 rounded-lg text-sm">Toutes</button>
        <button data-filter="Entrée" class="filter-btn bg-white border px-4 py-2 rounded-lg text-sm">Entrées</button>
        <button data-filter="Plat principal" class="filter-btn bg-white border px-4 py-2 rounded-lg text-sm">Plats principaux</button>
        <button data-filter="Dessert" class="filter-btn bg-white border px-4 py-2 rounded-lg text-sm">Desserts</button>
      </div>

      <div id="reserve" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <p id="empty-reserve" class="hidden text-center text-gray-500 py-8">
        Aucune recette disponible.
      </p>
    </section>

    <section id="form-section" class="hidden mt-10">
      <div class="bg-white border rounded-xl p-6 max-w-xl">
        <h2 class="text-xl font-bold mb-5">Ajouter une recette</h2>

        <form id="recipe-form" class="space-y-4">
          <div>
            <label for="recipe-name" class="block text-sm font-medium mb-1">Nom de la recette</label>
            <input id="recipe-name" type="text" maxlength="60" required class="w-full border rounded-lg p-3">
          </div>

          <div>
            <label for="recipe-category" class="block text-sm font-medium mb-1">Catégorie</label>
            <select id="recipe-category" required class="w-full border rounded-lg p-3 bg-white">
              <option value="Entrée">Entrée</option>
              <option value="Plat principal">Plat principal</option>
              <option value="Dessert">Dessert</option>
            </select>
          </div>

          <div>
            <label for="recipe-price" class="block text-sm font-medium mb-1">Prix en DH</label>
            <input id="recipe-price" type="number" min="0.01" max="50" step="0.01" required class="w-full border rounded-lg p-3">
          </div>

          <p id="form-error" class="hidden text-sm text-red-600"></p>

          <div class="flex gap-3">
            <button type="submit" class="bg-green-700 hover:bg-green-800 text-white px-5 py-2 rounded-lg">Enregistrer</button>
            <button id="cancel-form" type="button" class="bg-gray-100 hover:bg-gray-200 px-5 py-2 rounded-lg">Annuler</button>
          </div>
        </form>
      </div>
    </section>

    <p id="message" role="status" aria-live="polite" class="mt-5 text-sm"></p>

  </main>

</body>
</html>
